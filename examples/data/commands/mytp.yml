# yaml-language-server: $schema=../../../schemas/mcf-command.schema.json
# /mytp <target> <location>
# 展示：内置 selectors + 自定义静态列表 + 数据提取
command: mytp
description: 自定义传送命令
# 从函数文件中提取数据：遇到 /mytp set xxx → 存入 type "warp"
extract:
  - pattern: "set <name>"
    type: warp
children:
  - literal:
      name: set
      description: 设置传送点
      children:
        - argument:
            name: <name>
            suggest: placeholder
  - literal:
      name: tp
      description: 传送到传送点
      children:
        - argument:
            name: <target>
            suggest: selectors
            children:
              - argument:
                  name: <location>
                  suggest: warp    # ← 引用 extract 提取的数据
  - literal:
      name: list
      description: 列出传送点
