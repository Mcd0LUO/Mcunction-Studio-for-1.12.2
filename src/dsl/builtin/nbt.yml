# /nbt get|set entity|block ...
command: nbt
children:
  - literal:
      name: get
      children:
        - literal:
            name: entity
            children:
              - argument:
                  name: <sel>
                  suggest: selectors
                  children:
                    - argument:
                        name: <path>
                        optional: true
        - literal:
            name: block
            children:
              - argument:
                  name: <x>
                  suggest: coordinates
                  children:
                    - argument:
                        name: <y>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <z>
                              suggest: coordinates
                              children:
                                - argument:
                                    name: <path>
                                    optional: true
  - literal:
      name: set
      children:
        - literal:
            name: entity
            children:
              - argument:
                  name: <sel>
                  suggest: selectors
                  children:
                    - argument:
                        name: <path>
                        children:
                          - literal:
                              name: value
                              children:
                                - argument:
                                    name: <value>
                          - literal:
                              name: from
                              children:
                                - literal:
                                    name: var
                                    children:
                                      - argument:
                                          name: <ns>
                                          children:
                                            - argument:
                                                name: <var>
                                - literal:
                                    name: score
                                    children:
                                      - argument:
                                          name: <sel>
                                          suggest: selectors
                                          children:
                                            - argument:
                                                name: <obj>
                                                suggest: scoreboards
                                - literal:
                                    name: entity
                                    children:
                                      - argument:
                                          name: <sel>
                                          suggest: selectors
                                          children:
                                            - argument:
                                                name: <path>
                                - literal:
                                    name: block
                                    children:
                                      - argument:
                                          name: <x>
                                          suggest: coordinates
                                          children:
                                            - argument:
                                                name: <y>
                                                suggest: coordinates
                                                children:
                                                  - argument:
                                                      name: <z>
                                                      suggest: coordinates
                                                      children:
                                                        - argument:
                                                            name: <path>
                                - literal:
                                    name: time
                                    children:
                                      - argument:
                                          name: <unit>
                                - literal:
                                    name: value
                                    children:
                                      - argument:
                                          name: <value>
        - literal:
            name: block
            children:
              - argument:
                  name: <x>
                  suggest: coordinates
                  children:
                    - argument:
                        name: <y>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <z>
                              suggest: coordinates
                              children:
                                - argument:
                                    name: <path>
                                    children:
                                      - literal:
                                          name: value
                                          children:
                                            - argument:
                                                name: <value>
                                      - literal:
                                          name: from
                                          children:
                                            - literal:
                                                name: var
                                                children:
                                                  - argument:
                                                      name: <ns>
                                                      children:
                                                        - argument:
                                                            name: <var>
                                            - literal:
                                                name: score
                                                children:
                                                  - argument:
                                                      name: <sel>
                                                      suggest: selectors
                                                      children:
                                                        - argument:
                                                            name: <obj>
                                                            suggest: scoreboards
                                            - literal:
                                                name: entity
                                                children:
                                                  - argument:
                                                      name: <sel>
                                                      suggest: selectors
                                                      children:
                                                        - argument:
                                                            name: <path>
                                            - literal:
                                                name: block
                                                children:
                                                  - argument:
                                                      name: <x>
                                                      suggest: coordinates
                                                      children:
