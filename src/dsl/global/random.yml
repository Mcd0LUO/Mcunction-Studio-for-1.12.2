# yaml-language-server: $schema=../../../schemas/mcf-command.schema.json
# /random var|score range|sample ...
command: random
children:
  - literal:
      name: var
      children:
        - literal:
            name: range
            children:
              - argument:
                  name: <ns>
                  children:
                    - argument:
                        name: <var>
                        children:
                          - argument:
                              name: <min>
                              children:
                                - argument:
                                    name: <max>
                                    children:
                                      - literal:
                                          name: int
                                      - literal:
                                          name: float
        - literal:
            name: sample
            children:
              - argument:
                  name: <ns>
                  children:
                    - argument:
                        name: <var>
                        children:
                          - argument:
                              name: <count>
  - literal:
      name: score
      children:
        - literal:
            name: range
            children:
              - argument:
                  name: <obj>
                  suggest: scoreboards
                  children:
                    - argument:
                        name: <sel>
                        suggest: selectors
                        children:
                          - argument:
                              name: <min>
                              children:
                                - argument:
                                    name: <max>
        - literal:
            name: sample
            children:
              - argument:
                  name: <ns>
                  children:
                    - argument:
                        name: <var>
                        children:
                          - argument:
                              name: <obj>
                              suggest: scoreboards
                              children:
                                - argument:
                                    name: <sel>
                                    suggest: selectors
