# yaml-language-server: $schema=../../../schemas/mcf-command.schema.json
# /schedule function|repeat|random|clear ...
command: schedule
children:
  - literal:
      name: function
      children:
        - argument:
            name: <function>
            suggest: functions
            children:
              - argument:
                  name: <time>
                  children:
                    - literal:
                        name: append
                    - literal:
                        name: replace
  - literal:
      name: repeat
      children:
        - argument:
            name: <function>
            suggest: functions
            children:
              - argument:
                  name: <interval>
                  children:
                    - argument:
                        name: <count>
                        optional: true
  - literal:
      name: random
      children:
        - argument:
            name: <function>
            suggest: functions
            children:
              - argument:
                  name: <min>
                  children:
                    - argument:
                        name: <max>
  - literal:
      name: clear
      children:
        - argument:
            name: <function>
            suggest: functions
            optional: true
