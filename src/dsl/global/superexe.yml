# /superexe [if|unless|facing|positioned] [...] run <command>
command: superexe
children:
  - literal:
      name: if
      children:
        - literal:
            name: entity
            children:
              - argument:
                  name: <sel>
                  suggest: selectors
        - literal:
            name: block
            children:
              - argument:
                  name: <x>
                  suggest: coordinates
                  children:
                    - argument:
                        name: <y>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <z>
                              suggest: coordinates
        - literal:
            name: score
            children:
              - argument:
                  name: <sel>
                  suggest: selectors
                  children:
                    - argument:
                        name: <obj>
                        suggest: scoreboards
        - literal:
            name: var
            children:
              - argument:
                  name: <ns>
                  children:
                    - argument:
                        name: <var>
        - literal:
            name: data
            children:
              - literal:
                  name: entity
                  children:
                    - argument:
                        name: <sel>
                        suggest: selectors
              - literal:
                  name: block
                  children:
                    - argument:
                        name: <x>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <y>
                              suggest: coordinates
                              children:
                                - argument:
                                    name: <z>
                                    suggest: coordinates
  - literal:
      name: unless
      children:
        - literal:
            name: entity
            children:
              - argument:
                  name: <sel>
                  suggest: selectors
        - literal:
            name: block
            children:
              - argument:
                  name: <x>
                  suggest: coordinates
                  children:
                    - argument:
                        name: <y>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <z>
                              suggest: coordinates
        - literal:
            name: score
            children:
              - argument:
                  name: <sel>
                  suggest: selectors
                  children:
                    - argument:
                        name: <obj>
                        suggest: scoreboards
        - literal:
            name: var
            children:
              - argument:
                  name: <ns>
                  children:
                    - argument:
                        name: <var>
        - literal:
            name: data
            children:
              - literal:
                  name: entity
                  children:
                    - argument:
                        name: <sel>
                        suggest: selectors
              - literal:
                  name: block
                  children:
                    - argument:
                        name: <x>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <y>
                              suggest: coordinates
                              children:
                                - argument:
                                    name: <z>
                                    suggest: coordinates
  - literal:
      name: facing
      children:
        - literal:
            name: entity
            children:
              - argument:
                  name: <sel>
                  suggest: selectors
        - literal:
            name: block
            children:
              - argument:
                  name: <x>
                  suggest: coordinates
                  children:
                    - argument:
                        name: <y>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <z>
                              suggest: coordinates
  - literal:
      name: positioned
      children:
        - argument:
            name: <pos>
            suggest: selectors
  - literal:
      name: run
      children:
        - forward: true
