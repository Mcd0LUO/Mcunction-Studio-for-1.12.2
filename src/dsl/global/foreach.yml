# yaml-language-server: $schema=../../../schemas/mcf-command.schema.json
# /foreach var|data ... as <ns> <var> run <command>
command: foreach
children:
  - literal:
      name: var
      children:
        - argument:
            name: <ns>
            children:
              - argument:
                  name: <list_var>
                  children:
                    - literal:
                        name: as
                        children:
                          - argument:
                              name: <ns>
                              children:
                                - argument:
                                    name: <item_var>
                                    children:
                                      - literal:
                                          name: run
                                          children:
                                            - forward: true
  - literal:
      name: data
      children:
        - literal:
            name: entity
            children:
              - argument:
                  name: <selector>
                  suggest: selectors
                  children:
                    - argument:
                        name: <path>
                        children:
                          - literal:
                              name: as
                              children:
                                - argument:
                                    name: <ns>
                                    children:
                                      - argument:
                                          name: <item_var>
                                          children:
                                            - literal:
                                                name: run
                                                children:
                                                  - forward: true
        - literal:
            name: block
            children:
              - argument:
                  name: <x>
                  suggest: coordinates
                  children:
                    - argument:
                        name: <y>
                        suggest: coordinates
                        children:
                          - argument:
                              name: <z>
                              suggest: coordinates
                              children:
                                - argument:
                                    name: <path>
                                    children:
                                      - literal:
                                          name: as
                                          children:
                                            - argument:
                                                name: <ns>
                                                children:
                                                  - argument:
                                                      name: <item_var>
                                                      children:
                                                        - literal:
                                                            name: run
                                                            children:
                                                              - forward: true
