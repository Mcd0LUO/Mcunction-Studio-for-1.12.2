# yaml-language-server: $schema=../../../schemas/mcf-command.schema.json
# /team add|remove|join|leave|clear|list|option ...
command: team
children:
  - literal:
      name: add
      children:
        - argument:
            name: <name>
            suggest: placeholder
            children:
              - argument:
                  name: <displayName>
                  optional: true
  - literal:
      name: remove
      children:
        - argument:
            name: <name>
            suggest: teams
  - literal:
      name: join
      children:
        - argument:
            name: <name>
            suggest: teams
            children:
              - argument:
                  name: <target>
                  suggest: selectors
  - literal:
      name: leave
      children:
        - argument:
            name: <target>
            suggest: selectors
  - literal:
      name: clear
      children:
        - argument:
            name: <name>
            suggest: teams
  - literal:
      name: list
  - literal:
      name: option
      children:
        - argument:
            name: <name>
            suggest: teams
            children:
              - argument:
                  name: <key>
                  suggest: teamOptions
                  children:
                    - argument:
                        name: <value>
                        suggest: placeholder
